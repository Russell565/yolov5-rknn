# YOLOv5 with SE Attention
# 说明：SE版本1 是原始版本，SE版本2 是调整位置后的版本（SE往浅层移动）

nc: 80  # 类别数
depth_multiple: 0.33  # 模型深度倍数
width_multiple: 0.50  # 通道宽度倍数
anchors:
  - [10,13, 16,30, 33,23]  # P3/8 小目标
  - [30,61, 62,45, 59,119]  # P4/16 中目标
  - [116,90, 156,198, 373,326]  # P5/32 大目标

# ============================================================
# SE版本2（推荐）：SE模块往浅层移动
# 修改内容：
# 1. 在P2层后新增SE（增强基础特征）
# 2. 保留P3层后的SE（增强纹理细节）
# 3. 保留P4层后的SE（增强轮廓特征）
# 4. 移除SPPF后的SE（避免过度压缩）
# ============================================================
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]],    # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],      # 1-P2/4
   [-1, 3, C3, [128]],              # 2
   [-1, 1, SE, [64, 32]],            # 3 ← 压缩比r=32，显著减弱注意力强度
   [-1, 1, Conv, [256, 3, 2]],      # 4-P3/8
   [-1, 6, C3, [256]],              # 5 → 实际128通道
   [-1, 1, SE, [128, 32]],           # 6 ← 压缩比r=32，显著减弱注意力强度
   [-1, 1, Conv, [512, 3, 2]],      # 7-P4/16
   [-1, 9, C3, [512]],              # 8 → 实际256通道
   [-1, 1, SE, [256, 32]],           # 9 ← 压缩比r=32，显著减弱注意力强度
   [-1, 1, Conv, [1024, 3, 2]],     # 10-P5/32
   [-1, 3, C3, [1024]],             # 11 → 实际512通道
   [-1, 1, SPPF, [1024, 5]],        # 12 ← 移除SE，避免过度压缩全局特征
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 9], 1, Concat, [1]],     # cat backbone P4 (第9层)
   [-1, 3, C3, [512, False]],     # 16

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 5], 1, Concat, [1]],     # cat backbone P3 (第5层)
   [-1, 3, C3, [256, False]],     # 20 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 17], 1, Concat, [1]],    # cat head P4
   [-1, 3, C3, [512, False]],     # 23 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 13], 1, Concat, [1]],    # cat head P5
   [-1, 3, C3, [1024, False]],    # 26 (P5/32-large)
   
   [[20, 23, 26], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]

