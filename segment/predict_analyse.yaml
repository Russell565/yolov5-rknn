# YOLOv5分割推理配置文件

# 模型权重文件路径
weights: /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train-seg/20251119鲜果4cls分割模型/weights/best.pt  # 推理模型权重文件

# 是否保存推理结果的标签
save_txt: true  # 保存结果到*.txt文件

# 是否保存原图与推理图对比
# true: 保存对比图，false: 只保存推理图
is_compare: true

# 是否保存结果图像
# true: 不保存图像，false: 保存图像	nosave: false

# 类别定义：数字ID与中文名称的对应关系
class:
  "0": "鲜果"
  "1": "缺陷果"
  "2": "异形果"
  "3": "坏果"

# 是否启用推理结果分析
# true: 生成分析报告，false: 不生成分析报告
is_analyze: true

# 输出总目录名称，所有推理结果将保存在这个总目录下
output_main_dir: inference_results_1124

# 源图像和标签目录对列表
