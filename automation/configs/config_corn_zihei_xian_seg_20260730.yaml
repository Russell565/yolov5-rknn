# SFTP推送配置
sftp:
  open: 0                  # 是否开启SFTP推送功能
  
  # 远程设备信息
  host: "10.17.3.150"  # 板子的 IP 地址
  port: 22  # SFTP 端口号
  username: "root"  # 用户名
  password: "sbdquad1"  # 密码
  # private_key: "/path/to/private_key"  # 私钥路径（如果使用密钥认证）
  
  # 多文件推送配置
  files:
    - local_file: "/home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train-seg/xianguo-seg-cls4-0129/weights/xianguo_cls_0129_encrypt.rknn"  # 本地模型文件路径
      remote_dir: "/userdata/nvme_ssd/push_test/0129"  # 远程模型目录
      remote_file: "xianguo_cls_0129_test_encrypt.rknn"  # 远程模型文件名（可选，默认与本地文件名相同）
    - local_file: "/home/user/cv_project/corn-detection/yolov5-rknn-self/automation/src/run_test.sh"
      remote_dir: "/userdata/nvme_ssd/push_test/0129"
      remote_file: "run_test.sh"
    - local_file: "/home/user/cv_project/corn-detection/yolov5-rknn-self/automation/src/corn-grading-det-daemon.conf"
      remote_dir: "/userdata/nvme_ssd/push_test/0129"
      remote_file: "corn-grading-det-daemon.conf"
    - local_file: "/home/user/cv_project/corn-detection/yolov5-rknn-self/automation/config.yaml"
      remote_dir: "/userdata/nvme_ssd/push_test/0129"
      remote_file: "config.yaml"
  
  # 超时配置
  timeout: 30  # 连接超时时间（秒）
  
  # 远程执行脚本配置
  remote_exec:
    enable: 1             # 是否开启远程执行功能
    script_path: /userdata/nvme_ssd/push_test/0129/run_test.sh  # 远程脚本路径
    params: ""  # 脚本参数，直接传参格式
    timeout: 300          # 远程执行超时时间（秒）

# 日志配置
logging:
  level: "INFO"  # 日志级别：DEBUG, INFO, WARNING, ERROR
  log_file: "/home/user/cv_project/corn-detection/yolov5-rknn-self/automation/sftp_push.log"  # 日志文件路径

# 板子测试配置
board_test:
  temp_path: "/userdata/nvme_ssd/push_test/0129"  # 板子上的临时路径A
  target_path: "/speciband"  # 板子上的原程序路径B
  daemon_name: "corn-grading-det-daemon"  # 守护程序名称
  test_command: "/speciband/corn-grading-det-daemon --mode test --image /userdata/nvme_ssd/push_test/0129/20251218_test --cycle 0 --interval 1000"  # 测试命令
  config_file: "corn-grading-det-daemon.conf"  # 配置文件名
  model_file: "xianguo_cls_0129_test_encrypt.rknn"  # 模型文件名
  backup_suffix: "_test_bk"  # 备份文件后缀

# 微信推送配置
wechat:
  open: 1                  # 是否开启微信推送
  
  # 基础配置（与 send_message 方法参数对应）
  base:
    python_tool_path: "/home/user/cv_project/python_tool/python"  # Python工具路径
    webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=b562a2d4-5f8a-4d9c-9acc-71679589f908"  # 直接配置webhook
    config_path: ""          # 外部配置文件路径（可选）
    env_prefix: "YOLO_WECHAT_"  # 环境变量前缀
    dry_run: 0              # 测试模式，不实际发送
    timeout_s: 10            # HTTP超时时间
    trust_env: 0             # 是否信任环境变量
    markdown: 1              # 默认使用markdown格式
  
  # 消息节点配置（哪些节点需要推送消息）
  nodes:
    train_start: 1           # 训练开始
    train_end: 1             # 训练结束
    test_result: 1           # 测试结果
    model_conversion: 1      # 模型转换
    error: 1                 # 错误信息
    sftp_push: 0             # SFTP推送
    board_test: 0            # 板子测试
  
  # 消息模板配置
  templates:
    train_start:             # 训练开始模板
      title: "紫黑鲜玉米缺陷分割(20260730)训练任务开始"
    train_end:               # 训练结束模板
      title: "紫黑鲜玉米缺陷分割(20260730)训练任务结束"
    test_result:             # 测试结果模板
      title: "紫黑鲜玉米缺陷分割(20260730)测试结果"
    model_conversion:        # 模型转换模板
      title: "紫黑鲜玉米缺陷分割(20260730)模型转换"
    error:                   # 错误信息模板
      title: "紫黑鲜玉米缺陷分割(20260730)任务错误"
    sftp_push:               # SFTP推送模板
      title: "SFTP推送"
    board_test:              # 板子测试模板
      title: "板上测试"