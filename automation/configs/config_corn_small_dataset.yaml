# YOLOv5 小规模玉米检测数据集训练配置
# 适用场景：数据集规模 < 1000 张图像

# ==================== 数据集配置 ====================
data: "data/spb/tip_end/corn-head-det-data-20260521.yaml"  # 数据集路径

# ==================== 模型配置 ====================
model: "models/yolov5s.yaml"       # 使用轻量级模型
weights: "yolov5s.pt"              # 预训练权重
cfg: ""                            # 模型配置文件（可选）

# ==================== 训练参数 ====================
epochs: 150                        # 训练轮数（小数据集可适当增加）
batch_size: 16                     # 批次大小（根据GPU显存调整）
img_size: 640                      # 输入图像尺寸
rect: False                        # 矩形训练（False更适合小数据集）
resume: False                      # 是否恢复训练

# ==================== 优化器与学习率 ====================
optimizer: "SGD"                   # 优化器选择（SGD更稳定）
lr0: 0.001                         # 初始学习率（微调场景）
lrf: 0.01                          # 学习率衰减因子
warmup_epochs: 5                   # 预热轮数

# ==================== 正则化与增强 ====================
hyp: "data/hyps/hyp.corn_small_dataset.yaml"  # 超参数配置
augment: True                      # 启用数据增强
cache: True                        # 缓存图像到内存（加速训练）

# ==================== 迁移学习设置 ====================
freeze: 10                         # 冻结前10层（骨干网络）
patience: 30                       # 早停耐心值

# ==================== 评估与保存 ====================
val_interval: 1                    # 每轮评估一次
save_period: 5                     # 每5轮保存一次
project: "runs/train"              # 输出目录
name: "corn_small_dataset_exp"     # 实验名称

# ==================== 硬件配置 ====================
device: "0"                        # GPU设备
workers: 8                         # 数据加载线程数

# ==================== 训练策略说明 ====================
# 1. 使用预训练权重进行迁移学习
# 2. 冻结骨干网络保护低级特征
# 3. 低学习率微调避免破坏预训练知识
# 4. 强数据增强增加样本多样性
# 5. 较长训练轮数充分学习有限数据
