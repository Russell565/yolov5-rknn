# 自动化训练/测试配置文件

# 基础配置
base:
  conda_env: rknn          # 基础conda环境（train/test未指定时使用）
  working_dir: /home/user/cv_project/corn-detection/yolov5-rknn-self  # 工作目录（绝对路径）
  output_root: /home/user/cv_project/corn-detection/yolov5-rknn-self/train_log/task0115  # 所有结果的统一存储根目录

# 训练配置
train:
  open: 0                   # 是否开启训练任务
  conda_env: rknn     # 训练专用conda环境（可选）
  det_script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/train.py  # 检测训练脚本
  seg_script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/segment/train.py  # 分割训练脚本
  mode: seg                 # det或seg
  
  # DDP训练配置
  ddp:
    enable: 1               # 是否开启DDP训练
    nproc_per_node: 2       # 每个节点使用的GPU数量
    device: 0,1             # 使用的GPU设备ID
  
  # 权重配置
  weights: /home/user/cv_project/corn-detection/yolov5-rknn-self/yolov5s-seg.pt  # 初始权重路径
  
  # 恢复训练配置
  resume:
    open: 0                 # 是否开启恢复训练
    model_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train-seg/20251220鲜果分类分割模型/weights/best.pt  # 恢复训练权重路径
  
  # 核心训练参数
  core_params:
    only-corn: 0            # 项目特定参数
    project: /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train-seg  # 训练结果保存目录
    name: xianguo-seg-cls4-0115  # 本次训练模型名称
    hyp: /home/user/cv_project/corn-detection/yolov5-rknn-self/data/hyps/hyp.xianguo_grading_det.yaml  # 超参数文件路径
    data: /home/user/cv_project/corn-detection/yolov5-rknn-self/data/spb/xianguo/xianguo-segment-cls-20251215.yaml  # 数据集配置文件路径
    epochs: 900             # 训练轮次
    patience: 50           # 早停耐心值
    batch_size: 64          # 批量大小
    workers: 24             # 数据加载进程数
    save_period: 1          # 权重保存间隔
    # img_size: 640           # 输入图像大小
    # seed: 42                # 随机种子
  
  # 扩展训练参数
  extra_params:
    # lr0: 0.01               # 初始学习率
    # box: 0.05               # 边界框损失权重
    # cls: 0.5                # 分类损失权重
    # iou_train: 0.7          # 训练时的IOU阈值
    # augment: true           # 是否使用数据增强
    # multi_scale: true       # 是否使用多尺度训练
  
  # 日志配置
  log:
    redirect: 1             # 是否重定向日志
    log_file: /home/user/cv_project/corn-detection/yolov5-rknn-self/train_log/task0115/train_xianguo_seg_cls_20260115_test.out  # 日志文件路径
  
  # 环境记录配置
  env_record:
    enable: 1               # 是否记录环境信息
    save_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/train_log/task0115/env_info  # 环境信息保存路径
    save_requirements: 1    # 是否保存依赖列表
    save_config: 1          # 是否备份当前配置文件
    save_system_info: 1     # 是否保存系统信息
  
  # 模型转换配置
  model_conversion:
    enable: 1               # 是否启用模型转换
    script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/output_rknn.sh  # 转换脚本路径
    convert_after_train: 1  # 1：训练结束进行转换 0：不训练亦可进行转换(一般用于直接测试)
    convert_weights:        # 需要转换的权重文件
      - /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train-seg/xianguo-seg-cls4-0115/weights/best.pt
    # rknn_output_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train-seg/xianguo-seg-cls4-0115/weights  # RKNN模型输出路径
    custom_name: xianguo_cls_0115  # 自定义RKNN文件名（可选），默认使用权重文件名
    params:                 # 模型转换额外参数
      task_type: seg        # 任务类型（det或seg）
      calib_dir: xianguo    # 校准图像目录名

# 测试配置
test:
  open: 1                   # 是否开启测试任务
  conda_env: rknn    # 测试专用conda环境（可选）
  det_script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/detect.py  # 检测测试脚本
  seg_script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/segment/predict.py  # 分割测试脚本
  mode: seg                 # det或seg，可独立配置
  
  # 核心测试参数
  core_params:
    iou_threshold: 0.5      # IOU阈值
    conf_thres: 0.25        # 置信度阈值
    img_size: 640           # 输入图像大小
    project: /home/user/cv_project/corn-detection/yolov5-rknn-self/train_log/task0115/test_results  # 测试结果保存目录
    name: xianguo-seg-cls4-0115  # 测试结果子目录名
    save_txt: true          # 是否保存检测结果为TXT
    # save_conf: true         # 是否保存置信度
  
  # 扩展测试参数
  extra_params:
    # visualize: true         # 是否可视化结果
    # agnostic_nms: true      # 是否使用类别无关的NMS
    # max_det: 1000           # 最大检测数量
  
  # 测试触发配置
  test_trigger:
    test_on_save: 1         # 保存权重时是否进行测试
    test_final: 1           # 训练结束后是否测试last.pt和best.pt
    test_interval: 5  # 测试间隔
  
  # 直接测试配置
  direct_test:
    open: 1                 # 是否开启直接测试模式（不训练，只测试）
    weights: [
      /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train-seg/xianguo-seg-cls4-0115/weights/best.pt
    ]             # 直接测试的权重文件列表，支持多个权重文件
  
  # 权重管理配置
  weight_management:
    delete_after_test: 1    # 测试完后是否删除中间权重文件（epoch*.pt），0-不删除，1-删除
    delete_log: 1           # 删除权重时是否记录日志，0-不记录，1-记录
  
  # 测试数据集配置
  dataset_config:
    open: 1                 # 是否启用测试数据集配置
    datasets:               # 测试数据集列表
      - name: xianguo_final  # 数据集名称
        img_path: /data/train_data/dataset/xianguo_project/train/xianguo_cls4_data/new_test_data/xianguo_final  # 父目录
        img_subdir: images   # 图片子目录名
        label_subdir: labels_seg  # 标签子目录名
      - name: quexian_final
        img_path: /data/train_data/dataset/xianguo_project/train/xianguo_cls4_data/new_test_data/quexian_final
        img_subdir: images
        label_subdir: labels_seg
      - name: yixing_final
        img_path: /data/train_data/dataset/xianguo_project/train/xianguo_cls4_data/new_test_data/yixing_final
        img_subdir: images
        label_subdir: labels_seg
      - name: qiguo_final
        img_path: /data/train_data/dataset/xianguo_project/train/xianguo_cls4_data/new_test_data/qiguo_final
        img_subdir: images
        label_subdir: labels_seg
    zip: 0                  # 测试结果是否压缩（1-压缩，0-不压缩）
    
    # 像素过滤配置
    pixel_filter:
      enable: 1             # 0-禁用，1-启用
      left: 100             # 左侧过滤像素数
      right: 50             # 右侧过滤像素数
      top: 50               # 顶部过滤像素数
      bottom: 50            # 底部过滤像素数
  
  # 结果保存配置
  result:
    format: xlsx            # 结果格式
    file_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/train_log/task0115/metrics_xianguo-seg-cls4-0115_20260115.xlsx  # 结果文件路径
    output_dir: /home/user/cv_project/corn-detection/yolov5-rknn-self/train_log/task0115/test_results  # 测试输出目录

# 类别配置
class_config:
  type: seg                 # 类别类型
  classes:                  # 类别对照表
    0: 
      id: 0
      name: xianguo
      cn_name: 鲜果
    1:
      id: 1
      name: quexian
      cn_name: 缺陷果
    2:
      id: 2
      name: yixing
      cn_name: 异形果
    3:
      id: 3
      name: qiguo
      cn_name: 弃果

# 微信推送配置
wechat:
  open: 0                   # 是否开启微信推送
  
  # 基础配置（与 send_message 方法参数对应）
  base:
    python_tool_path: "/home/user/cv_project/python_tool/python"  # Python工具路径
    webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=b562a2d4-5f8a-4d9c-9acc-71679589f908"  # 直接配置webhook
    config_path: ""          # 外部配置文件路径（可选）
    env_prefix: "YOLO_WECHAT_"  # 环境变量前缀
    dry_run: 0              # 测试模式，不实际发送
    timeout_s: 10            # HTTP超时时间
    trust_env: 0             # 是否信任环境变量
    markdown: 1              # 默认使用markdown格式
  
  # 消息节点配置（哪些节点需要推送消息）
  nodes:
    train_start: 1           # 训练开始
    train_end: 1             # 训练结束
    test_result: 1           # 测试结果
    model_conversion: 1      # 模型转换
    error: 1                 # 错误信息
  
  # 消息模板配置
  templates:
    train_start:             # 训练开始模板
      title: "训练任务开始"
    train_end:               # 训练结束模板
      title: "训练任务结束"
    test_result:             # 测试结果模板
      title: "测试结果"
    model_conversion:        # 模型转换模板
      title: "模型转换"
    error:                   # 错误信息模板
      title: "任务错误"