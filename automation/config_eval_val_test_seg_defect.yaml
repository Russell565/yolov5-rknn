# 自动化训练/测试配置文件

# 基础配置
base:
  conda_env: rknn          # 基础conda环境（train/test未指定时使用）
  working_dir: /home/user/cv_project/corn-detection/yolov5-rknn-self  # 工作目录（绝对路径）
  output_root: /home/user/cv_project/corn-detection/yolov5-rknn-self/train_log/20260507-xian-huang-det-test-se   # 所有结果的统一存储根目录

# 训练配置
train:
  open: 0                   # 是否开启训练任务
  conda_env: rknn     # 训练专用conda环境（可选）
  det_script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/train.py  # 检测训练脚本
  seg_script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/segment/train.py  # 分割训练脚本
  mode: det                 # det或seg

  # DDP训练配置
  ddp:
    enable: 1               # 是否开启DDP训练
    nproc_per_node: 2       # 每个节点使用的GPU数量
    device: 0,1             # 使用的GPU设备ID

  # 权重配置
  weights: /home/user/cv_project/corn-detection/yolov5-rknn-self/yolov5s.pt  # 初始权重路径

  # 恢复训练配置
  resume:
    open: 0                 # 是否开启恢复训练
    model_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train/20260516花糯冻玉米检测模型/weights/best.pt  # 恢复训练权重路径

  # 核心训练参数
  core_params:
    # object-seg: 0            # 项目特定参数
    project: /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train  # 训练结果保存目录
    name: 20260516花糯冻玉米检测模型  # 本次训练模型名称
    hyp: /home/user/cv_project/corn-detection/yolov5-rknn-self/data/hyps/hyp.corn_grading_det_finetune.yaml  # 超参数文件路径
    data: /home/user/cv_project/corn-detection/yolov5-rknn-self/data/spb/grading/huang/xian_huang_corn_grading-det-20260507-test.yaml # 数据集配置文件路径
    epochs: 900             # 训练轮次
    patience: 50           # 早停耐心值
    batch_size: 64          # 批量大小
    workers: 24             # 数据加载进程数
    save_period: 100         # 权重保存间隔
    # img_size: 640           # 输入图像大小
    # seed: 42                # 随机种子

  # 扩展训练参数
  extra_params:
    # lr0: 0.01               # 初始学习率
    # box: 0.05               # 边界框损失权重
    # cls: 0.5                # 分类损失权重
    # iou_train: 0.7          # 训练时的IOU阈值
    # augment: true           # 是否使用数据增强
    # multi_scale: true       # 是否使用多尺度训练

  # 日志配置
  log:
    redirect: 1             # 是否重定向日志
    log_file: /home/user/cv_project/corn-detection/yolov5-rknn-self/train_log/20260507-xian-huang-det-test-se/20260507-xian-huang-det-test-se.out   # 日志文件路径

  # 环境记录配置
  env_record:
    enable: 1               # 是否记录环境信息
    save_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/train_log/20260507-xian-huang-det-test-se/env_info  # 环境信息保存路径
    save_requirements: 1    # 是否保存依赖列表
    save_config: 1          # 是否备份当前配置文件
    save_system_info: 1     # 是否保存系统信息

  # 模型转换配置
  model_conversion:
    enable: 0              # 是否启用模型转换
    script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/output_rknn.sh  # 转换脚本路径
    convert_after_train: 1  # 1：训练结束进行转换 0：不训练亦可进行转换(一般用于直接测试)
    convert_weights:        # 需要转换的权重文件
      - /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train/20260507黄鲜玉米检测模型测试se/weights/best.pt
    # rknn_output_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/runs/train/20260507黄鲜玉米检测模型测试se/weights  # RKNN模型输出路径
    custom_name: huang_xian_det_2026050716_test_se.rknn  # 自定义RKNN文件名（可选），默认使用权重文件名
    params:                 # 模型转换额外参数
      task_type: det        # 任务类型（det或seg）
      calib_dir: corn_huang    # 校准图像目录名

# 标签对齐配置
  label_alignment:
    enable: 0              # 是否启用标签对齐（仅对det模式有效）
    script_path: /home/user/cv_project/python_tool/shell/pre_process/Label_alignment.py  # 标签对齐脚本路径

# 测试配置
test:
  open: 1                   # 是否开启测试任务
  conda_env: rknn    # 测试专用conda环境（可选）
  det_script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/detect.py  # 检测测试脚本
  seg_script_path: /home/user/cv_project/corn-detection/yolov5-rknn-self/segment/predict.py  # 分割测试脚本
  mode: seg                 # det或seg，可独立配置

  # 核心测试参数
  core_params:
    iou_threshold: 0.5      # IOU阈值
    conf_thres: 0.25        # 置信度阈值
    img_size: 640           # 输入图像大小
    project: /data/test_result/dong/det/20260630_huang_corn_det_test # 测试结果保存目录
    name: 20260630_huang_corn_det_test # 测试结果子目录名
    save_txt: true          # 是否保存检测结果为TXT
    # save_conf: true         # 是否保存置信度

  # 扩展测试参数
  extra_params:
    # visualize: true         # 是否可视化结果
    # agnostic_nms: true      # 是否使用类别无关的NMS
    # max_det: 1000           # 最大检测数量

  # 测试触发配置
  test_trigger:
    test_on_save: 1         # 保存权重时是否进行测试
    test_final: 1           # 训练结束后是否测试last.pt和best.pt
    test_interval: 5  # 测试间隔

