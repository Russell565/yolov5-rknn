# Hyperparameters for low-augmentation COCO training from scratch
# python train.py --batch 64 --cfg yolov5n6.yaml --weights '' --data coco.yaml --img 640 --epochs 300 --linear
# See tutorials for hyperparameter evolution https://github.com/ultralytics/yolov5#tutorials

lr0: 0.01  # 初始学习率 / 填写值：SGD=1E-2, Adam=1E-3 / 控制模型学习的速度，微调场景建议使用0.001
lrf: 0.01  # 最终学习率 / 填写值：lr0 * lrf / 控制学习率的衰减程度
momentum: 0.937  # SGD动量/Adam beta1 / 填写值：0.937 / 加速模型收敛，提高训练稳定性
weight_decay: 0.0005  # 优化器权重衰减 / 填写值：5e-4 / 防止模型过拟合
warmup_epochs: 3.0  # 学习率预热轮数 / 填写值：可使用小数 / 防止训练初期学习率过大导致模型不稳定
warmup_momentum: 0.8  # 预热初始动量 / 填写值：0.8 / 预热期间的动量值，逐渐过渡到目标动量
warmup_bias_lr: 0.1  # 预热初始偏置学习率 / 填写值：0.1 / 预热期间的偏置学习率
box: 0.05  # 边界框损失权重 / 填写值：0.05 / 控制边界框预测的损失权重
cls: 0.5  # 分类损失权重 / 填写值：0.5 / 控制分类预测的损失权重
cls_pw: 1.0  # 分类损失正样本权重 / 填写值：1.0 / 处理类别不平衡问题
obj: 1.0  # 目标损失权重 / 填写值：1.0 / 控制目标存在性预测的损失权重，随像素缩放
obj_pw: 1.0  # 目标损失正样本权重 / 填写值：1.0 / 处理目标存在性预测的类别不平衡
iou_t: 0.20  # IoU训练阈值 / 填写值：0.20 / 控制训练时的IoU阈值
anchor_t: 4.0  # 锚框倍数阈值 / 填写值：4.0 / 控制锚框与目标的匹配阈值
# anchors: 3  # 每层输出的锚框数量 / 填写值：3 / 每层输出的锚框数量，0表示忽略
fl_gamma: 0.0  # 焦点损失gamma参数 / 填写值：0.0 / 0表示不使用焦点损失，大于0时增强对难样本的关注
hsv_h: 0.3  # 图像HSV色调增强 / 填写值：0.3（增强幅度，范围0-25°） / 增加模型对色调变化的鲁棒性
hsv_s: 0.9  # 图像HSV饱和度增强 / 填写值：0.9（增强幅度） / 增加模型对饱和度变化的鲁棒性
hsv_v: 0.6  # 图像HSV明度增强 / 填写值：0.6（增强幅度） / 增加模型对亮度变化的鲁棒性
degrees: 0  # 图像旋转增强 / 填写值：0（±度） / 增加模型对旋转变化的鲁棒性
translate: 0.1  # 图像平移增强 / 填写值：0.1（±分数） / 增加模型对位置变化的鲁棒性
scale: 0.5  # 图像缩放增强 / 填写值：0.5（±增益） / 增加模型对尺度变化的鲁棒性
shear: 0.0  # 图像剪切增强 / 填写值：0.0（±度） / 增加模型对剪切变换的鲁棒性
perspective: 0.0  # 图像透视变换增强 / 填写值：0.0（范围0-0.001） / 增加模型对透视变换的鲁棒性
flipud: 0.5  # 图像上下翻转增强 / 填写值：0.5（概率） / 增加模型对上下方向的鲁棒性
fliplr: 0.0  # 图像左右翻转增强 / 填写值：0.0（概率） / 增加模型对左右方向的鲁棒性
mosaic: 1.0  # 图像马赛克增强 / 填写值：1.0（概率） / 增加模型对多目标场景的鲁棒性
mixup: 0.0  # 图像混合增强 / 填写值：0.0（概率） / 增加模型对样本混合的鲁棒性
copy_paste: 0.0  # 分割复制粘贴增强 / 填写值：0.0（概率） / 增加模型对分割任务的鲁棒性
gray: 0.2  # 图像灰度转换增强 / 填写值：0.5（概率） / 降低模型对颜色的敏感度，提高鲁棒性